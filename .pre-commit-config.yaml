repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      # Run the linter
      - id: ruff-check
        types_or: [python, pyi]
        # args: [--fix]  # active auto-fix si besoin

      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi]